<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bctBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="100%" stop-color="#1c2541"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" rx="16" fill="url(#bctBg)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="70" x2="600" y2="70"/>
    <line x1="0" y1="140" x2="600" y2="140"/>
    <line x1="0" y1="210" x2="600" y2="210"/>
    <line x1="0" y1="280" x2="600" y2="280"/>
    <line x1="120" y1="0" x2="120" y2="350"/>
    <line x1="240" y1="0" x2="240" y2="350"/>
    <line x1="360" y1="0" x2="360" y2="350"/>
    <line x1="480" y1="0" x2="480" y2="350"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="300" cy="150" r="140" fill="url(#glowGrad)"/>

  <!-- Logo Mark Container -->
  <g filter="url(#dropShadow)" transform="translate(230, 45)">
    <!-- Mountain Base / Peak Shape -->
    <path d="M 15 110 L 70 25 L 125 110 Z" fill="none" stroke="url(#chartGrad)" stroke-width="6" stroke-linejoin="round"/>
    <!-- Candlestick Bar 1 -->
    <line x1="45" y1="70" x2="45" y2="105" stroke="#10b981" stroke-width="3"/>
    <rect x="40" y="75" width="10" height="20" rx="2" fill="#10b981"/>
    <!-- Candlestick Bar 2 (Peak) -->
    <line x1="70" y1="35" x2="70" y2="90" stroke="#06b6d4" stroke-width="3"/>
    <rect x="65" y="45" width="10" height="35" rx="2" fill="#06b6d4"/>
    <!-- Candlestick Bar 3 -->
    <line x1="95" y1="65" x2="95" y2="105" stroke="#3b82f6" stroke-width="3"/>
    <rect x="90" y="70" width="10" height="25" rx="2" fill="#3b82f6"/>
    <!-- Trend Line Arrow -->
    <path d="M 25 95 Q 60 70 115 40" fill="none" stroke="#10b981" stroke-width="4" stroke-dasharray="4 4"/>
    <polygon points="115,35 122,43 110,45" fill="#10b981"/>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="3" fill="#ffffff">
    BASE CAMP TRADING
  </text>

  <!-- Subtitle Badge -->
  <rect x="180" y="235" width="240" height="30" rx="15" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.3)" stroke-width="1"/>
  <text x="300" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="1.5" fill="#34d399">
    FINANCIAL TRADING &amp; ANALYTICS
  </text>
</svg>
