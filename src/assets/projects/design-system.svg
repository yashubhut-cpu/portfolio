<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="100%" height="100%">
  <defs>
    <linearGradient id="dsBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#31103f"/>
    </linearGradient>
    <linearGradient id="pinkPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="dsShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ec4899" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="350" rx="16" fill="url(#dsBg)"/>

  <!-- Figma Style Component Nodes Background -->
  <g stroke="rgba(236, 72, 153, 0.15)" stroke-width="1" fill="none">
    <rect x="60" y="50" width="80" height="60" rx="6" stroke-dasharray="3 3"/>
    <rect x="460" y="50" width="80" height="60" rx="6" stroke-dasharray="3 3"/>
    <rect x="60" y="240" width="80" height="60" rx="6" stroke-dasharray="3 3"/>
    <rect x="460" y="240" width="80" height="60" rx="6" stroke-dasharray="3 3"/>
  </g>

  <!-- Design System Icon Graphic -->
  <g filter="url(#dsShadow)" transform="translate(225, 40)">
    <!-- Layer Card 1 (Back) -->
    <rect x="45" y="10" width="80" height="55" rx="8" fill="rgba(99, 102, 241, 0.3)" stroke="#6366f1" stroke-width="2"/>
    <!-- Layer Card 2 (Middle) -->
    <rect x="35" y="30" width="80" height="55" rx="8" fill="rgba(168, 85, 247, 0.4)" stroke="#a855f7" stroke-width="2"/>
    <!-- Layer Card 3 (Front - UI Card) -->
    <rect x="25" y="50" width="100" height="65" rx="10" fill="#1f2937" stroke="url(#pinkPurple)" stroke-width="3"/>
    
    <!-- Component Elements Inside Front Card -->
    <circle cx="45" cy="70" r="8" fill="#ec4899"/>
    <rect x="60" y="66" width="50" height="8" rx="4" fill="#f472b6"/>
    <rect x="45" y="88" width="65" height="14" rx="7" fill="url(#pinkPurple)"/>
  </g>

  <!-- Brand Typography -->
  <text x="300" y="210" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="28" letter-spacing="3" fill="#ffffff">
    UI / UX DESIGN SYSTEM
  </text>

  <!-- Subtitle Badge -->
  <rect x="150" y="235" width="300" height="30" rx="15" fill="rgba(236, 72, 153, 0.15)" stroke="rgba(244, 114, 182, 0.35)" stroke-width="1"/>
  <text x="300" y="255" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" letter-spacing="1.5" fill="#f472b6">
    PRODUCT COMPONENT &amp; DESIGN TOKENS
  </text>
</svg>
